[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basesentinel-langchain"
version = "1.0.0"
description = "LangChain tool: scan Base contracts via BaseSentinel (HTTP 402 + USDC tx-hash proof)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BlackSwan Labs", email = "blackswanlabsos@gmail.com" }]
keywords = ["langchain", "base", "x402", "threat-intel", "basesentinel", "m2m"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "langchain-core>=0.3.0",
  "web3>=6.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
agents = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
]
dev = [
  "build>=1.2.0",
  "twine>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://blackswanlabs.pl"
API = "https://api.blackswanlabs.pl"
Repository = "https://github.com/BlackSwanLabsOS/BaseSentinel"
Issues = "https://github.com/BlackSwanLabsOS/BaseSentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["basesentinel_langchain*"]
exclude = ["tests*", "examples*"]
