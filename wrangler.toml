name = "base-sentinel"
main = "src/index.ts"
compatibility_date = "2026-07-28"
workers_dev = true

# Receiving wallet for M2M scan payments (replace with your address).
[vars]
PAYMENT_ADDRESS = "0x21360A04853b85a8d2E918b73f97C8ccf5939946"
NETWORK = "base"
# Discovery / eth_getLogs — public Base pool (comma-separated; code also appends defaults).
# Round-robin on 429/timeout keeps Alchemy CU for payments only.
LOGS_RPC_URL = "https://mainnet.base.org,https://base.gateway.tenderly.co,https://1rpc.io/base,https://base-mainnet.public.blastapi.io,https://base.meowrpc.com"

[[kv_namespaces]]
binding = "SCAN_CACHE"
id = "083d1d22fbd0476798f3fdaa6cdad67d"

# Auto-discover + scan newly paired tokens every 1 minute.
[triggers]
crons = ["* * * * *"]

# Custom domains (Cloudflare zone: blackswanlabs.pl)
[[routes]]
pattern = "api.blackswanlabs.pl"
custom_domain = true

[[routes]]
pattern = "blackswanlabs.pl"
custom_domain = true

[[routes]]
pattern = "www.blackswanlabs.pl"
custom_domain = true
